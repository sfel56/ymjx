<head>

<style>
  :root {
    --bg: #f4f6fb;
    --card: rgba(255, 255, 255, .78);
    --card-solid: #ffffff;
    --text: #17203a;
    --text-sub: #64748b;
    --text-faint: #94a3b8;
    --border: rgba(15, 23, 42, .08);
    --border-strong: rgba(15, 23, 42, .14);
    --accent: #4f6ef7;
    --accent-2: #8b5cf6;
    --accent-dark: #3d5ae0;
    --accent-soft: rgba(79, 110, 247, .1);
    --danger: #dc2626;
    --danger-bg: rgba(220, 38, 38, .08);
    --danger-border: rgba(220, 38, 38, .22);
    --ok: #059669;
    --row-hover: rgba(79, 110, 247, .05);
    --chip-bg: rgba(15, 23, 42, .05);
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 12px 40px rgba(15, 23, 42, .08);
    --shadow-lg: 0 4px 12px rgba(15, 23, 42, .08), 0 24px 64px rgba(15, 23, 42, .12);
    --glow: rgba(79, 110, 247, .4);
    --orb-1: rgba(99, 102, 241, .18);
    --orb-2: rgba(56, 189, 248, .15);
    --orb-3: rgba(168, 85, 247, .12);
    --sk: linear-gradient(90deg, rgba(15,23,42,.06) 25%, rgba(15,23,42,.12) 37%, rgba(15,23,42,.06) 63%);
    --radius: 16px;
  }
  [data-theme="dark"] {
    --bg: #0a0e1a;
    --card: rgba(19, 25, 42, .66);
    --card-solid: #141a2c;
    --text: #e9edf6;
    --text-sub: #8b97ad;
    --text-faint: #5d6a83;
    --border: rgba(148, 163, 184, .14);
    --border-strong: rgba(148, 163, 184, .26);
    --accent-soft: rgba(99, 112, 255, .14);
    --danger-bg: rgba(248, 113, 113, .1);
    --danger-border: rgba(248, 113, 113, .3);
    --row-hover: rgba(99, 112, 255, .08);
    --chip-bg: rgba(148, 163, 184, .1);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 40px rgba(0, 0, 0, .35);
    --shadow-lg: 0 4px 12px rgba(0, 0, 0, .4), 0 24px 64px rgba(0, 0, 0, .45);
    --glow: rgba(99, 112, 255, .35);
    --orb-1: rgba(99, 102, 241, .16);
    --orb-2: rgba(56, 189, 248, .1);
    --orb-3: rgba(168, 85, 247, .12);
    --sk: linear-gradient(90deg, rgba(148,163,184,.08) 25%, rgba(148,163,184,.16) 37%, rgba(148,163,184,.08) 63%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.65;
    overflow-x: hidden;
    transition: background .35s ease, color .35s ease;
  }

  /* ---- 背景光斑 ---- */
  .orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .orb-1 { width: 560px; height: 560px; background: var(--orb-1); top: -180px; left: -120px; animation: drift 22s ease-in-out infinite alternate; }
  .orb-2 { width: 480px; height: 480px; background: var(--orb-2); top: 10%; right: -160px; animation: drift 26s ease-in-out infinite alternate-reverse; }
  .orb-3 { width: 420px; height: 420px; background: var(--orb-3); bottom: -160px; left: 30%; animation: drift 30s ease-in-out infinite alternate; }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(60px, 40px) scale(1.08); }
    100% { transform: translate(-40px, -30px) scale(.95); }
  }

  .container { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 56px 24px 72px; }

  /* ---- 主题切换 ---- */
  .theme-btn {
    position: absolute; top: 24px; right: 24px;
    width: 42px; height: 42px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-sub);
    transition: color .2s, transform .2s, border-color .2s;
  }
  .theme-btn:hover { color: var(--accent); border-color: var(--border-strong); transform: rotate(12deg); }
  .theme-btn svg { width: 20px; height: 20px; }
  .icon-sun, .icon-moon { display: none; }
  [data-theme="light"] .icon-sun { display: block; }
  [data-theme="dark"] .icon-moon { display: block; }

  /* ---- 头部 ---- */
  header { text-align: center; margin-bottom: 40px; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px var(--glow), inset 0 1px 0 rgba(255,255,255,.25);
    animation: logoFloat 5s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  .logo svg { width: 32px; height: 32px; stroke: #fff; }
  h1 {
    font-size: 32px; font-weight: 800; letter-spacing: .5px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .subtitle { color: var(--text-sub); font-size: 14.5px; margin-top: 8px; }

  /* ---- 卡片 ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 28px;
    margin-bottom: 20px;
    transition: background .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  /* ---- 搜索 ---- */
  .search-box { position: relative; }
  .search-box .search-icon {
    position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; stroke: var(--text-faint); pointer-events: none;
    transition: stroke .2s;
  }
  .search-box input {
    width: 100%;
    height: 54px;
    padding: 0 150px 0 50px;
    font-size: 15.5px;
    color: var(--text);
    border: 1.5px solid var(--border-strong);
    border-radius: 13px;
    background: transparent;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  [data-theme="light"] .search-box input { background: rgba(255,255,255,.7); }
  [data-theme="dark"] .search-box input { background: rgba(10, 14, 26, .4); }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .search-box:focus-within .search-icon { stroke: var(--accent); }
  .search-box input::placeholder { color: var(--text-faint); }
  .btn-query {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    height: 40px;
    padding: 0 22px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: box-shadow .2s, filter .2s, transform .15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    white-space: nowrap;
  }
  .btn-query:hover { box-shadow: 0 8px 20px var(--glow); filter: brightness(1.06); transform: translateY(-50%) translateY(-1px); }
  .btn-query:active { transform: translateY(-50%) translateY(0); }
  .btn-query:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; filter: none; transform: translateY(-50%); }
  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- 快捷示例 / 历史 ---- */
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .chips-label { font-size: 12.5px; color: var(--text-faint); white-space: nowrap; }
  .chip {
    font-size: 12.5px;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--chip-bg);
    color: var(--text-sub);
    cursor: pointer;
    transition: color .18s, border-color .18s, transform .18s;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .chip:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }

  /* ---- 提示条 ---- */
  .alert {
    display: none;
    padding: 13px 18px;
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 20px;
    animation: fadeUp .3s ease;
    align-items: center; gap: 10px;
  }
  .alert.show { display: flex; }
  .alert.error { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
  .alert svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ---- 概要 ---- */
  .summary { display: none; }
  .summary-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .domain-badge { font-size: 20px; font-weight: 800; word-break: break-all; letter-spacing: .3px; }
  .summary-meta { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; padding: 5px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 600; white-space: nowrap;
  }
  .stat-chip svg { width: 13px; height: 13px; }
  .divider { height: 1px; background: var(--border); margin: 18px 0 6px; }

  /* ---- 记录分组 ---- */
  .group { padding: 14px 0; }
  .group + .group { border-top: 1px dashed var(--border); }
  .group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .type-badge {
    font-size: 12px; font-weight: 800; letter-spacing: 1px;
    padding: 4px 12px; border-radius: 8px;
    color: #fff;
    background: var(--tc, var(--accent));
    box-shadow: 0 3px 10px calc(var(--tc, var(--accent)) 40%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .type-label { font-size: 13.5px; color: var(--text-sub); font-weight: 500; }
  .type-count { margin-left: auto; font-size: 12px; color: var(--text-faint); }

  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    transition: background .15s;
  }
  .row:hover { background: var(--row-hover); }
  .row-value {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13.5px;
    word-break: break-all;
    flex: 1; min-width: 0;
  }
  .row-value .row-field { color: var(--text-faint); font-size: 12px; margin-right: 8px; font-family: inherit; }
  .row-meta { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
  .meta-chip {
    font-size: 11px; padding: 3px 9px; border-radius: 6px;
    background: var(--chip-bg); color: var(--text-sub);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: nowrap;
  }
  .copy-btn {
    border: none; background: transparent; color: var(--accent);
    cursor: pointer; padding: 6px; border-radius: 8px;
    display: flex; align-items: center; opacity: .45;
    transition: opacity .15s, background .15s, color .15s;
    flex-shrink: 0;
  }
  .copy-btn svg { width: 15px; height: 15px; }
  .row:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
  .copy-btn:hover { background: var(--accent-soft); }

  /* ---- 骨架屏 ---- */
  .skeleton-card { display: none; }
  .sk {
    background: var(--sk);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 8px;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  .sk-head { width: 45%; height: 24px; margin-bottom: 18px; }
  .sk-row { height: 40px; margin-bottom: 10px; }
  .sk-row.w75 { width: 75%; } .sk-row.w90 { width: 90%; } .sk-row.w60 { width: 60%; }

  /* ---- 空状态 ---- */
  .empty {
    display: none; text-align: center; padding: 34px 0 12px; color: var(--text-sub);
    animation: fadeUp .35s ease;
  }
  .empty svg { width: 52px; height: 52px; stroke: var(--text-faint); margin-bottom: 12px; opacity: .7; }
  .empty p { font-size: 14px; }

  footer {
    text-align: center; color: var(--text-faint); font-size: 12.5px;
    margin-top: 44px; line-height: 1.9;
  }
  footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
  footer a:hover { text-decoration: underline; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .reveal { animation: fadeUp .35s ease both; }

  @media (max-width: 560px) {
    .container { padding: 40px 16px 56px; }
    .theme-btn { top: 16px; right: 16px; }
    .card { padding: 22px 18px; }
    h1 { font-size: 26px; }
    .search-box input { padding-right: 90px; font-size: 15px; }
    .btn-query { padding: 0 16px; height: 38px; font-size: 13.5px; }
    .summary-meta { margin-left: 0; width: 100%; }
    .copy-btn { opacity: 1; }
    .row { padding: 10px 8px; }
    .orbs .orb { filter: blur(70px); }
  }
</style>
</head>

<script>
(function () {
  'use strict';

  var API_URL = 'https://api.xiaoyu17love.top/API/yycx.php';
  var API_KEY = '69352d027d924c4023e246d5bf1b4fb9901699ca56a7c11f9bd1493227228ab7';

  var DOMAIN_RE = /^(?=.{1,253}$)(?!-)([a-z0-9-]{1,63}\.)+[a-z]{2,}$/i;

  var input = document.getElementById('domainInput');
  var btn = document.getElementById('queryBtn');
  var btnText = document.getElementById('btnText');
  var spinner = document.getElementById('spinner');
  var alertBox = document.getElementById('alert');
  var alertText = document.getElementById('alertText');
  var summary = document.getElementById('summary');
  var recordsBox = document.getElementById('records');
  var emptyBox = document.getElementById('empty');
  var skeletonCard = document.getElementById('skeletonCard');
  var historyChips = document.getElementById('historyChips');
  var themeBtn = document.getElementById('themeBtn');

  var TYPE_CONFIG = {
    A:    { color: '#3b82f6', label: 'IPv4 地址记录' },
    AAAA: { color: '#8b5cf6', label: 'IPv6 地址记录' },
    CNAME:{ color: '#ec4899', label: '别名记录' },
    MX:   { color: '#f59e0b', label: '邮件交换记录' },
    TXT:  { color: '#10b981', label: '文本记录' },
    NS:   { color: '#06b6d4', label: '域名服务器记录' },
    SOA:  { color: '#64748b', label: '权威起始记录' }
  };
  var FALLBACK_COLOR = '#8b93a7';

  /* ---- 主题 ---- */
  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('dns-theme', next); } catch (e) {}
  });

  /* ---- 历史记录 ---- */
  function getHistory() {
    try { return JSON.parse(localStorage.getItem('dns-history') || '[]'); } catch (e) { return []; }
  }
  function saveHistory(d) {
    var h = getHistory().filter(function (x) { return x !== d; });
    h.unshift(d);
    h = h.slice(0, 5);
    try { localStorage.setItem('dns-history', JSON.stringify(h)); } catch (e) {}
    renderHistory();
  }
  function renderHistory() {
    var h = getHistory();
    if (h.length === 0) { historyChips.style.display = 'none'; return; }
    historyChips.innerHTML = '<span class="chips-label">最近：</span>';
    h.forEach(function (d) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.textContent = d;
      b.setAttribute('data-domain', d);
      historyChips.appendChild(b);
    });
    historyChips.style.display = 'flex';
  }
  document.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.chip[data-domain]') : null;
    if (chip) {
      input.value = chip.getAttribute('data-domain');
      handleSubmit();
    }
  });
  renderHistory();

  /* ---- 工具函数 ---- */
  function showAlert(msg) {
    alertText.textContent = msg;
    alertBox.className = 'alert error show reveal';
  }
  function hideAlert() { alertBox.className = 'alert'; }

  function setLoading(on) {
    btn.disabled = on;
    spinner.style.display = on ? 'inline-block' : 'none';
    btnText.textContent = on ? '查询中' : '查询';
    skeletonCard.style.display = on ? 'block' : 'none';
    if (on) { summary.style.display = 'none'; hideAlert(); }
  }

  function normalizeDomain(raw) {
    return raw.trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('/')[0].toLowerCase();
  }

  function fmtTTL(t) {
    if (typeof t !== 'number') return 'TTL ' + (t === undefined || t === null ? '-' : t);
    if (t % 86400 === 0 && t >= 86400) return 'TTL ' + (t / 86400) + 'd';
    if (t % 3600 === 0 && t >= 3600) return 'TTL ' + (t / 3600) + 'h';
    return 'TTL ' + t + 's';
  }

  var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';

  function copyText(text, e) {
    var target = e.currentTarget;
    var done = function () {
      target.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ok)"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      setTimeout(function () { target.innerHTML = COPY_SVG; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }
  }

  function makeCopyBtn(text) {
    var b = document.createElement('button');
    b.className = 'copy-btn';
    b.type = 'button';
    b.innerHTML = COPY_SVG;
    b.setAttribute('aria-label', '复制');
    b.addEventListener('click', function (e) { e.stopPropagation(); copyText(text, e); });
    return b;
  }

  function makeRow(valueHTML, metaList, copyValue) {
    var row = document.createElement('div');
    row.className = 'row';
    var v = document.createElement('div');
    v.className = 'row-value';
    v.innerHTML = valueHTML;
    row.appendChild(v);
    if (metaList && metaList.length) {
      var meta = document.createElement('div');
      meta.className = 'row-meta';
      metaList.forEach(function (m) {
        var s = document.createElement('span');
        s.className = 'meta-chip';
        s.textContent = m;
        meta.appendChild(s);
      });
      row.appendChild(meta);
    }
    if (copyValue) row.appendChild(makeCopyBtn(copyValue));
    return row;
  }

  function makeGroup(type, label, count) {
    var cfg = TYPE_CONFIG[type] || { color: FALLBACK_COLOR, label: type + ' 记录' };
    var g = document.createElement('div');
    g.className = 'group reveal';
    var head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML = '<span class="type-badge" style="--tc:' + cfg.color + '">' + type + '</span>' +
      '<span class="type-label">' + (label || cfg.label) + '</span>' +
      '<span class="type-count">' + count + ' 条</span>';
    g.appendChild(head);
    var rows = document.createElement('div');
    rows.className = 'rows';
    g.appendChild(rows);
    return { group: g, rows: rows };
  }

  function appendTypeRecords(type, list, delay) {
    var cfg = TYPE_CONFIG[type] || { color: FALLBACK_COLOR, label: type + ' 记录' };
    var built = makeGroup(type, null, list.length);
    built.group.style.animationDelay = delay + 'ms';

    list.forEach(function (r) {
      var ttl = (typeof r.ttl === 'number') ? fmtTTL(r.ttl) : null;
      var copyVal = null;

      if (type === 'A' && r.ip) {
        copyVal = r.ip;
        built.rows.appendChild(makeRow(escapeHtml(r.ip), ttl ? [ttl] : [], copyVal));
      } else if (type === 'AAAA' && r.ipv6) {
        copyVal = r.ipv6;
        built.rows.appendChild(makeRow(escapeHtml(r.ipv6), ttl ? [ttl] : [], copyVal));
      } else if ((type === 'NS' || type === 'CNAME') && r.target) {
        copyVal = r.target;
        built.rows.appendChild(makeRow(escapeHtml(r.target), ttl ? [ttl] : [], copyVal));
      } else if (type === 'MX' && r.target) {
        copyVal = r.target + (r.priority !== undefined ? ' (优先级 ' + r.priority + ')' : '');
        var meta = [];
        if (r.priority !== undefined) meta.push('优先级 ' + r.priority);
        if (ttl) meta.push(ttl);
        built.rows.appendChild(makeRow(escapeHtml(r.target), meta, copyVal));
      } else if (type === 'TXT' && r.txt) {
        copyVal = r.txt;
        built.rows.appendChild(makeRow(escapeHtml(r.txt), ttl ? [ttl] : [], copyVal));
      } else if (type === 'SOA') {
        var fields = [
          ['主服务器 mname', r.mname],
          ['管理员 rname', r.rname],
          ['序列号 serial', r.serial],
          ['刷新 refresh', r.refresh],
          ['重试 retry', r.retry],
          ['过期 expire', r.expire],
          ['最小 TTL minimum', r.minimum_ttl]
        ];
        fields.forEach(function (f) {
          if (f[1] === undefined || f[1] === null) return;
          built.rows.appendChild(makeRow(
            '<span class="row-field">' + f[0] + '</span>' + escapeHtml(String(f[1])),
            ttl ? [ttl] : [],
            String(f[1])
          ));
        });
      } else {
        var text = JSON.stringify(r);
        built.rows.appendChild(makeRow(escapeHtml(text), ttl ? [ttl] : [], text));
      }
    });

    recordsBox.appendChild(built.group);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderResult(data) {
    hideAlert();
    recordsBox.innerHTML = '';
    emptyBox.style.display = 'none';

    document.getElementById('domainText').textContent = data.domain || '-';
    document.getElementById('recordCount').textContent = (data.record_count || 0) + ' 条记录';
    document.getElementById('queryTime').textContent = data.query_time || '-';

    var records = data.records || [];
    if (records.length === 0) {
      summary.style.display = 'block';
      emptyBox.style.display = 'block';
      return;
    }

    var groups = {};
    var order = [];
    records.forEach(function (r) {
      var t = (r.type || 'OTHER').toUpperCase();
      if (!groups[t]) { groups[t] = []; order.push(t); }
      groups[t].push(r);
    });
    order.forEach(function (t, i) {
      appendTypeRecords(t, groups[t], i * 70);
    });

    summary.style.display = 'block';
    summary.classList.add('reveal');
  }

  function query(domain) {
    setLoading(true);
    saveHistory(domain);

    var url = API_URL + '?apikey=' + encodeURIComponent(API_KEY) + '&url=' + encodeURIComponent(domain);

    fetch(url, { method: 'GET' })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json && json.code === 200 && json.data) {
          setLoading(false);
          renderResult(json.data);
        } else {
          var msg = (json && json.msg) ? json.msg : '查询失败，请稍后重试';
          setLoading(false);
          skeletonCard.style.display = 'none';
          showAlert('查询失败：' + msg);
        }
      })
      .catch(function () {
        setLoading(false);
        skeletonCard.style.display = 'none';
        showAlert('网络请求失败，请检查网络连接后重试');
      });
  }

  function handleSubmit() {
    var domain = normalizeDomain(input.value);
    if (!domain) { showAlert('请输入域名后再查询'); return; }
    if (!DOMAIN_RE.test(domain)) { showAlert('域名格式不正确，请输入合法域名，例如 example.com'); return; }
    query(domain);
  }

  btn.addEventListener('click', handleSubmit);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') handleSubmit();
  });
})();
</script>
</body>
</html>
